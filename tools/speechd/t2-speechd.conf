# /etc/conf.d/t2-speechd — Titan 2 voice-call speech control (t2-speechd)
# Daemon options (see tools/speechd/README.md). Defaults: -v (log every packet),
# state file = modem FSM in debugfs, ALSA card hw:Titan2, Voice Call PCM hw:Titan2,4, 48 kHz,
# Handset Volume 0 (= -10 dB: start quiet, raise with "t2-speechd volume N" / -H).
#T2_SPEECHD_ARGS="-v -S /sys/kernel/debug/d180000.mddriver/fsm -c hw:Titan2 -P hw:Titan2,4 -f 48000 -H 0"
#T2_SPEECHD_LOG=/var/log/t2-speechd.log
#T2_SPEECHD_SOCK=/run/t2-speechd.sock

# codec_routes = 0|1 (daemon option -r). Who sets the codec (RCV Mux, HP muxes, mic muxes,
# PGA gains, pin switches, Handset/Speaker Volume) in a call:
#   0 = the "Voice Call" UCM verb, i.e. PipeWire/WirePlumber (tools/ucm/Titan2/VoiceCall.conf);
#       t2-speechd only switches the modem's PCM 1 interconnect and holds hw:Titan2,4 open.
#       Default. Needs the Voice Call profile active during the call (WirePlumber >= 0.5.11
#       does it from ModemManager's call state, or `pactl set-card-profile ... "Voice Call ..."`).
#   1 = t2-speechd sets the codec itself (behaviour before 2026-10-29). Fallback when the
#       Voice Call profile is not in place; PipeWire may then undo it on a device change.
T2_SPEECHD_CODEC_ROUTES=0
