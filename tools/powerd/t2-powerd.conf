# /etc/t2-powerd.conf: the Titan 2 sleep broker. Reload: t2-powerctl reload.
# Every value below is the default.

# Seconds after the screen goes off (DRM connector DPMS off, or
# "t2-powerctl screen off" from the compositor) before the system suspends.
suspend_delay = 20

# DRM connector whose dpms file gives the screen state (empty: the first
# connected one, DSI-1 on the Titan 2).
#connector = DSI-1

# Observed blockers (a development phone: keep the transports alive).
# Android would sleep through all three; switch them off for battery tests.
inhibit_on_ssh = yes          # an ESTABLISHED connection to port 22
inhibit_on_usb_host = yes     # the USB gadget is configured by a host (a charger is not a host)
inhibit_on_nbd_root = yes     # the root file system comes over the network

# A short press of the power key switches the screen (hooks screen-off /
# screen-on); off when the desktop handles the key itself.
power_key = yes
power_key_device = mtk-pmic-keys

# How long the phone stays awake after a wake-up, by its class (seconds).
wake_grace_user = 10          # a key: the desktop turns the screen on
wake_grace_modem = 20         # a call or an SMS (ModemManager signal): time for the UI
wake_grace_modem_quiet = 3    # any other modem wake-up (indications); 0 = wake_grace_modem
wake_grace_network = 3        # a Wi-Fi frame or a Bluetooth event (Android: ~0.3 s wakelock); an SSH
                              # connection then blocks by itself (inhibit_on_ssh)
wake_grace_other = 5          # unexplained
wake_grace_alarm = 60         # a user alarm with the UI flag

# Maintenance ("doze") windows while the screen is off: the RTC wakes the
# phone after these intervals in turn (seconds), the hooks in
# /etc/t2-powerd/hooks/maintenance(.d) run with the screen off, then the
# phone sleeps again. A user wake-up starts the sequence over. Empty = none.
maintenance = 900, 1800, 3600, 7200
maintenance_window = 30

# After an unexplained sleep shorter than short_sleep seconds (from the
# suspend to the resume on CLOCK_BOOTTIME, i.e. including the time asleep)
# the next attempt waits this long (seconds, in turn).
backoff = 2, 5, 15, 60
short_sleep = 3

# Calls and SMS from ModemManager over the system bus hold the phone awake.
dbus_modem = yes

# GPU boost on input: the GPU governor
# (panthor devfreq simple_ondemand) raises the clock only after a busy sampling
# period, so the first frames of a scroll or animation that starts from an idle
# GPU run at 265 MHz. On a touch or a key the devfreq min_freq is raised to
# gpu_boost_hz for gpu_boost_ms (each event extends it; the governor stays in
# charge above the floor), then the previous min_freq is put back. Off while
# the screen is off. "t2-powerctl gpu boost [MS]" does the same on request.
# gpu_boost = no returns to the plain governor.
gpu_boost = yes
gpu_boost_ms = 400
gpu_boost_hz = 664000000
gpu_boost_devices = Synaptics,TitanKey,keyboard,keypad,aw9523,mtk-kpd   # substrings of evdev names (Titan 2: touchscreen "Synaptics 57695-006", touchpad "Synaptics s1403", keyboard "TitanKey")
gpu_devfreq = /sys/class/devfreq/13000000.gpu

# Battery guard, only while discharging: the hooks battery-low and
# battery-critical run once each at these percentages (the desktop shows the
# warning, a hook may stop services); at battery_shutdown the battery-shutdown
# hooks run and battery_shutdown_cmd is executed, after two readings in a row
# at that level. A charger, or battery_low + 5 %, resets the levels (hook
# battery-ok). Read every battery_poll seconds while awake and after every
# wake-up, so a sleeping phone checks it in its maintenance windows.
# battery_supply names /sys/class/power_supply/<name> (empty: the first one of
# type Battery, sh366100-0 on the Titan 2). battery = no switches it off,
# a level of 0 switches that level off.
battery = yes
#battery_supply =
battery_low = 15
battery_critical = 5
battery_shutdown = 2
battery_poll = 60
battery_shutdown_cmd = /sbin/poweroff

# Hooks: pre-suspend, post-resume, wake-user, wake-modem, wake-network,
# wake-alarm, wake-other, maintenance, screen-off, screen-on, battery-low,
# battery-critical, battery-shutdown, battery-ok; each as a file or a .d
# directory (run-parts). Environment: T2_WAKE_CLASS, T2_WAKE_SOURCES,
# T2_WAKE_SPM, T2_SLEPT_MS, T2_ALARM, T2_MAINTENANCE_LEVEL, T2_BATTERY_CAPACITY,
# T2_BATTERY_STATUS, T2_BATTERY_LEVEL.
hooks_dir = /etc/t2-powerd/hooks
hook_timeout = 60

# Wake-up source names (substrings of /sys/class/wakeup/*/name and of the
# wake interrupt name) by class.
class_user = gpio-keys,keys,keypad,keyboard,aw9523,focaltech,fingerprint,touch
class_modem = mddriver,ccci,modem
class_network = wifi,wlan,mt7921,bt@,btmtkbgf,bluetooth
class_rtc = rtc

# Never write /sys/power/state (everything else runs): for a first look.
dry_run = no
# A dry run counts this many seconds as time asleep (tests of the timing).
#dry_run_asleep = 0

# info | debug
log_level = info
