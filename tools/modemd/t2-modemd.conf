# /etc/t2-modemd.conf: t2-modemd configuration, key = value, '#' comments.
# Every key is optional; the values shown are the built-in defaults unless the
# comment says otherwise. Command-line options (-d, -S, -a, -s) override the file;
# -o key=value overrides single keys.

# --- ports and readiness ---
#port = /dev/wwan0at0                    AT port (normally given with -d)
#state_file = /sys/kernel/debug/d180000.mddriver/fsm   first line "state: ready"; empty = none
#assume_ready = 0                        1: ready as soon as the port opens (no state file)
#socket = /run/t2-modemd.sock            control socket, mode 0660

# --- voice audio (t2-speechd) ---
#speechd_socket = /run/t2-speechd.sock
#audio = 1                               0: never talk to t2-speechd
#call_rate = 48000                       call-start --rate
#speech_on = dial                        dial: call-start right after ATD/ATA is accepted (factory
#                                        timing); espeech: only on +ESPEECH: 1 (modem driven)
#eaic_auto_accept = 1                    +EAIC incoming calls: 1 accept (AT+EAIC=0,id,seq) so
#                                        they ring, 0 reject with cause 21
#voice_init_cmds = AT+CMOD=0;ATS0=0;AT+CCWA=1;AT+CLIP=1;AT+CSSN=1,1;AT+CMUT=0;AT+ECPI=4294967295;AT+EAIC=2;AT+EVOCD=1

# --- radio and SIM ---
#radio_mask =                            1 (SIM1, AT+CFUN=1), 2 (SIM2), 3 (both): AT+EFUN=<n>, sent
#                                        after the start-up (radio_on_at_start=1) or at init (=0);
#                                        empty: AT+CFUN=1 (and nothing at init with =0)
#sim = 1                                 protocol stack selected at init (AT+ESUO=4/5)

# --- mobile data ---
#data_backend = mipc                     mipc: DATA_ACT_CALL over the MIPC port (factory path);
#                                        at: AT templates below (fallback, untested on the phone)
#mipc_port = /dev/wwan0mipc1
#mipc_client_name = /dev/wwan0mipc1      INTERNAL_OPEN_REQ client name (factory: the device path)
#mipc_timeout_ms = 30000                 confirm timeout
#mipc_traffic_descriptor = 0             1: add the 672-byte traffic descriptor TLV 0x010D
#data_apn =                              APN; empty: the attach context's APN (AT+CGDCONT?)
#data_ip_type = IP                       IP | IPV6 | IPV4V6
#data_cid = -1                           AT backend: context id to use, -1 = from the modem
#data_linkid = 0                         link index when the modem does not tell (transIntfId)
#wwan_dev = wwan0                        parent WWAN device: links are wwan0-<N>
#data_mtu = 1500                         0 = leave; a modem-given MTU wins
#route_metric = 600
#resolv_file = /run/t2-modemd/resolv.conf
#manage_resolv = 0                       1: also copy it to resolv_target
#resolv_target = /etc/resolv.conf
#keep_data_on_exit = 0                   1: leave the link up on SIGTERM
# AT backend templates: {apn} {aid} {tid} {linkid}; "@linkup" = create the link here;
# the aid comes from "+CGEV: ME PDN ACT <aid>", the tid from '+EPDN: <aid>,"new",<rat>,<tid>'.
# Empty data_bind_cmds = plain 3GPP (+CGDCONT/+CGACT, reuse the LTE default bearer cid 0).
#data_bind_cmds = AT+EAPNACT=1,"{apn}","default",0;AT+EPDN={aid},"ifst",20;AT+CGCONTRDP={aid};AT+EPDN={aid},"addr";@linkup;AT+EIF={tid}, "ifst", "up", 1
#data_deact_cmds = AT+EAPNACT=0,{aid},1

# --- IMS / VoLTE (README "IMS / VoLTE") ---
#ims = 1                                 1: AT+CIREG=2, AT+EIMSPDN= "onoff",1, AT+EIMSCFG, AT+EIMS?
#                                        when the radio is on; the IMS PDN the modem raises gets
#                                        its link (needs data_backend=mipc), EIPSPI answered;
#                                        0: nothing IMS is sent
#ims_cfg = 1,0,0,0,1,1                   AT+EIMSCFG=<volte>,<vilte>,<vowifi>,<viwifi>,<sms>,<eims>
#                                        (factory: 1,0,0,0,1,1 on SIM1, 0,0,0,0,1,1 on SIM2)
#ims_mipc_key = 1                        1: IMS_SET_CONFIG_REQ key/value form (mtk_ct_volte_support
#                                        = 0x32) before the flags form at start-up; 0: flags only
#apn_profiles = 1                        1: APN_ADD_PROFILE_LIST_REQ (internet, mms, ims, sos) at
#                                        start-up, before the radio; the modem raises the IMS PDN
#                                        only with an ims profile
#ims_apn = ims                           APN of the ims profile; empty = left out
#sos_apn = sos                           APN of the emergency profile; empty = left out
#mms_apn =                               APN of the mms profile; empty = left out
#radio_on_at_start = 1                   radio on (radio_mask, else AT+CFUN=1) after the start-up
#                                        on every (re)connected modem, unless "radio off" was given
#radio_off_before_setup = 0              1: a radio that is already on goes off before the set-up
#ims_reg_poll_ms = 5000                  AT+CIREG? after the IMS PDN came up, until registered
#ims_reg_idle_poll_ms = 60000            AT+CIREG? otherwise while IMS is on
#ims_eims = query                        AT+EIMS=1: query = only when AT+EIMS? (or a +EIMS URC)
#                                        says 0; always; never

# --- SMS ---
#sms_ack_cmd = AT+CNMA                   acknowledgement of +CMT (PDU mode)
#sms_delete_read = 0                     1: AT+CMGD after a +CMTI stored message was read

# --- timeouts and polling (ms) ---
#cmd_timeout_ms = 5000
#call_timeout_ms = 30000                 ATD / ATA / raw at
#sms_timeout_ms = 60000                  AT+CMGS
#scan_timeout_ms = 120000                AT+COPS=?
#signal_poll_ms = 10000                  AT+CSQ period, 0 = off
#call_poll_ms = 1000                     AT+CLCC period while calls exist
#ready_poll_ms = 500                     state file check
#reopen_ms = 1000                        port reopen retry
#settle_ms = 200                         pause after a command timeout

# --- raw AT passthrough ("at <command>") ---
#allow_raw_at = 1
#raw_at_deny = +CLCK;+CPWD;+CSIM;+CRSM;+CPIN;+CCHO;+CCHC;+CGLA;+CRLA;+CFUN=1,1
#init_cmds =                             extra AT commands after init, ';' separated
