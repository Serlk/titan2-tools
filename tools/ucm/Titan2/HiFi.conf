# Titan 2 HiFi verb. PCM devices: 0 = DL0 (codec: earpiece, headset),
# 1 = DL1 (loudspeaker amplifier), 2 = UL0 (microphones), 3 = UL1 (I2SIN4),
# 4 = Hostless Speech (voice call, held by t2-speechd, not a PipeWire PCM).
# All codec gains start at their lowest step (-10 dB outputs, 0 dB mic PGA).
#
# 2026-10-28 phone edits reproduced here from their description (the copy on
# the phone, /usr/share/alsa/ucm2/Titan2/HiFi.conf, next to HiFi.conf.bak-titan,
# was edited by hand; TODO diff it against this file before installing):
#  (a) the digital front-end -> back-end switches (ADDA_DL_* DL0_*,
#      I2SOUT4_* DL1_*, UL0_* ADDA_UL_*) are set for the whole time the verb
#      is active, at verb level, and are no longer in the Speaker, Headphones
#      (and Earpiece) devices. DPCM refuses to open a front end with no enabled
#      back end ("no backend DAIs enabled", EINVAL for PipeWire), and PipeWire
#      opens the PCMs before and independently of the port (device) it enables.
#  (b) Headphones priority 40 (below Earpiece 50): there is no USB-C jack
#      detection yet, the port must not be chosen by default.
#
# PipeWire (1.6) makes one sink/source per UCM device and one card profile per
# set of devices that can be used at the same time: "HiFi (Earpiece, Mic)",
# "HiFi (Mic, Speaker)", "HiFi (Headphones, Headset)", ... Changing the output
# is a profile change, which runs the DisableSequence of the old device and
# the EnableSequence of the new one.

SectionVerb {
	EnableSequence [
		cset "name='UL_SRC_MUX' 'AMIC'"
		cset "name='MISO0_MUX' 'UL1_CH1'"
		cset "name='MISO1_MUX' 'UL1_CH2'"
		# (a) media routes: DL0 -> codec DAC, DL1 -> amplifier, codec ADC -> UL0
		cset "name='ADDA_DL_CH1 DL0_CH1' 1"
		cset "name='ADDA_DL_CH2 DL0_CH2' 1"
		cset "name='I2SOUT4_CH1 DL1_CH1' 1"
		cset "name='I2SOUT4_CH2 DL1_CH2' 1"
		cset "name='UL0_CH1 ADDA_UL_CH1' 1"
		cset "name='UL0_CH2 ADDA_UL_CH2' 1"
	]

	DisableSequence [
		cset "name='UL0_CH2 ADDA_UL_CH2' 0"
		cset "name='UL0_CH1 ADDA_UL_CH1' 0"
		cset "name='I2SOUT4_CH2 DL1_CH2' 0"
		cset "name='I2SOUT4_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL0_CH2' 0"
		cset "name='ADDA_DL_CH1 DL0_CH1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# Loudspeaker: FS199x on I2SOUT4. The amplifier limits itself with the
# vendor DSP effect; its volume code is set below the factory maximum.
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='Speaker Volume' 768"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Speaker"
		PlaybackVolume "Speaker Volume"
	}
}

# Analog headset over USB-C: needs the ASW5480 switch in audio mode, which
# mainline does not do yet. No jack detection, so
# the priority (b) is the lowest of the outputs.
SectionDevice."Headphones" {
	Comment "Headphones (USB-C analog)"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='Headset Volume' 0,0"
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
		cset "name='Headphones Switch' on"
	]

	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
	]

	Value {
		PlaybackPriority 40
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headset"
		PlaybackVolume "Headset Volume"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='Handset Volume' 0"
		cset "name='RCV Mux' 'Voice Playback'"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='RCV Mux' 'Open'"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
		PlaybackVolume "Handset Volume"
	}
}

# Main microphone (AIN0) on the left ADC, second microphone (AIN2) on the
# right ADC: stereo capture, left = main. The UL0 switches are verb-level (a).
SectionDevice."Mic" {
	Comment "Internal Microphones"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='PGA1 Volume' 0"
		cset "name='PGA2 Volume' 0"
		cset "name='PGA_L_Mux' 'AIN0'"
		cset "name='PGA_R_Mux' 'AIN2'"
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='ADC_R_Mux' 'Right Preamplifier'"
		cset "name='Main Mic Switch' on"
		cset "name='Second Mic Switch' on"
	]

	DisableSequence [
		cset "name='Second Mic Switch' off"
		cset "name='Main Mic Switch' off"
		cset "name='ADC_L_Mux' 'Idle'"
		cset "name='ADC_R_Mux' 'Idle'"
		cset "name='PGA_L_Mux' 'None'"
		cset "name='PGA_R_Mux' 'None'"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA1"
		CaptureVolume "PGA1 Volume"
	}
}

# Headset microphone (AIN1) on the left ADC, mono to both channels: the
# right UL0 channel is moved from ADDA_UL_CH2 to ADDA_UL_CH1 while this
# device is on, so UL0 stays openable (a) and left = right = headset mic.
SectionDevice."Headset" {
	Comment "Headset Microphone (USB-C analog)"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='PGA1 Volume' 0"
		cset "name='PGA_L_Mux' 'AIN1'"
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='UL0_CH2 ADDA_UL_CH2' 0"
		cset "name='UL0_CH2 ADDA_UL_CH1' 1"
		cset "name='Headset Mic Switch' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='UL0_CH2 ADDA_UL_CH1' 0"
		cset "name='UL0_CH2 ADDA_UL_CH2' 1"
		cset "name='ADC_L_Mux' 'Idle'"
		cset "name='PGA_L_Mux' 'None'"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA1"
		CaptureVolume "PGA1 Volume"
	}
}
