# UCM2 for the Unihertz Titan 2 mainline sound card (card name "Titan2",
# machine driver mt6878-titan2, see the kernel's sound/soc/mediatek/mt6878).
# Install: /usr/share/alsa/ucm2/Titan2/ (this directory) and
# /usr/share/alsa/ucm2/conf.d/mt6878-titan2/Titan2.conf -> ../../Titan2/Titan2.conf
# (the conf.d directory name is the card driver name, see
# /proc/asound/card0/id and `alsaucm -c hw:0 -n dump text`).
#
# Verbs: HiFi (media, PipeWire) and Voice Call (modem <-> PCM 1 <-> codec,
# see README-voice-call.md). PipeWire/WirePlumber switch between them; a
# "Voice Call ..." profile is picked by WirePlumber's find-voice-call-profile
# hook (>= 0.5.11) while ModemManager reports a call, or by hand with
# `pactl set-card-profile`.
Syntax 6

SectionUseCase."HiFi" {
	File "/Titan2/HiFi.conf"
	Comment "Play HiFi quality Music"
}

SectionUseCase."Voice Call" {
	File "/Titan2/VoiceCall.conf"
	Comment "Voice Call"
}

# Everything off: the card comes up like this, keep it so. The verbs enable
# what they need and put it back in their DisableSequence.
BootSequence [
	cset "name='ADDA_DL_CH1 DL0_CH1' 0"
	cset "name='ADDA_DL_CH2 DL0_CH2' 0"
	cset "name='I2SOUT4_CH1 DL1_CH1' 0"
	cset "name='I2SOUT4_CH2 DL1_CH2' 0"
	cset "name='UL0_CH1 ADDA_UL_CH1' 0"
	cset "name='UL0_CH2 ADDA_UL_CH2' 0"
	cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 0"
	cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 0"
	cset "name='I2SOUT4_CH1 PCM_1_CAP_CH1' 0"
	cset "name='I2SOUT4_CH2 PCM_1_CAP_CH1' 0"
	cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' 0"
	cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' 0"
	cset "name='HPL Mux' 'Open'"
	cset "name='HPR Mux' 'Open'"
	cset "name='RCV Mux' 'Open'"
	cset "name='Headset Volume' 0,0"
	cset "name='Handset Volume' 0"
	cset "name='PGA1 Volume' 0"
	cset "name='PGA2 Volume' 0"
]
