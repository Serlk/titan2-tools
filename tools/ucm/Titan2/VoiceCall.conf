# Titan 2 "Voice Call" verb: the call path modem <-> AFE PCM 1 <-> codec
# (earpiece / headset / loudspeaker amplifier, microphones). Voice samples
# never pass through PipeWire: the modem drives PCM 1 and the AFE
# interconnect switches below join it to the codec and amplifier back ends.
# t2-speechd (tools/speechd) holds the Hostless Speech PCM hw:Titan2,4 open
# and talks to the modem; it does not touch the codec (codec_routes=0), the
# codec belongs to this verb, i.e. to PipeWire/WirePlumber. See
# tools/ucm/README-voice-call.md.
#
# Values: the ones t2-speechd wrote in a working call (tools/speechd/src/audio.c
# before 2026-10-29): Handset Volume 0 (-10 dB), Speaker Volume 512 of 1023,
# PGA1/PGA2 Volume 2 (+12 dB), RCV Mux "Voice Playback", mics AIN0 (main,
# left ADC) and AIN2 (second, right ADC), modem uplink CH1 = left, CH2 = right,
# modem downlink CH1 (mono) into both output channels.
#
# PCMs: the PipeWire sink/source PCMs of HiFi (0 = DL0 earpiece/headset,
# 1 = DL1 speaker, 2 = UL0 microphones) stay in this verb so that PipeWire has
# a sink and a source with Earpiece/Speaker/Headphones/Mic/Headset ports in
# the profile (callaudiod and WirePlumber select the profile by its name and
# ports). Their routes are enabled at verb level like in HiFi; media played
# during a call is summed into the codec path by the AFE interconnect (like
# notification sounds in a call on factory). PCM 4 is not a PipeWire PCM.
#
# PipeWire 1.6 creates one profile per set of simultaneously usable devices:
# "Voice Call (Earpiece, Mic)" (highest priority, the default in a call),
# "Voice Call (Mic, Speaker)", "Voice Call (Headphones, Mic)", and the same
# three with "Headset" instead of "Mic". A device change in a call is a
# profile change: `pactl set-card-profile <card> "Voice Call (Mic, Speaker)"`.
#
# The PCM 1 switches are set here AND by t2-speechd (same values, idempotent):
# here so that a profile change moves the modem downlink with the output, in
# t2-speechd so that the Hostless Speech PCM can be opened (DPCM needs an
# enabled back end) even before/without this verb.

SectionVerb {
	EnableSequence [
		# codec capture front end: analog mics, left -> CH1, right -> CH2
		cset "name='UL_SRC_MUX' 'AMIC'"
		cset "name='MISO0_MUX' 'UL1_CH1'"
		cset "name='MISO1_MUX' 'UL1_CH2'"
		# microphones -> modem (ADDA_UL_TO_MD1, PCM 1 playback side)
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' 1"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' 1"
		# media routes, so PCM 0/1/2 can be opened by PipeWire (see HiFi.conf (a))
		cset "name='ADDA_DL_CH1 DL0_CH1' 1"
		cset "name='ADDA_DL_CH2 DL0_CH2' 1"
		cset "name='I2SOUT4_CH1 DL1_CH1' 1"
		cset "name='I2SOUT4_CH2 DL1_CH2' 1"
		cset "name='UL0_CH1 ADDA_UL_CH1' 1"
		cset "name='UL0_CH2 ADDA_UL_CH2' 1"
	]

	DisableSequence [
		cset "name='UL0_CH2 ADDA_UL_CH2' 0"
		cset "name='UL0_CH1 ADDA_UL_CH1' 0"
		cset "name='I2SOUT4_CH2 DL1_CH2' 0"
		cset "name='I2SOUT4_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL0_CH2' 0"
		cset "name='ADDA_DL_CH1 DL0_CH1' 0"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' 0"
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' 0"
	]

	Value {
		TQ "Voice"
	}
}

# Receiver: modem downlink CH1 -> both ADDA channels -> DACL -> RCV.
# The default output of a call (highest playback priority of the verb).
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='Handset Volume' 0"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 1"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 1"
		cset "name='RCV Mux' 'Voice Playback'"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='RCV Mux' 'Open'"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 0"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
		PlaybackVolume "Handset Volume"
	}
}

# Loudspeaker: modem downlink CH1 -> both I2SOUT4 channels -> FS199x.
# The amplifier PLL needs a call rate >= 16 kHz (t2-speechd refuses 8 kHz).
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='I2SOUT4_CH1 PCM_1_CAP_CH1' 1"
		cset "name='I2SOUT4_CH2 PCM_1_CAP_CH1' 1"
		cset "name='Speaker Volume' 512"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='I2SOUT4_CH2 PCM_1_CAP_CH1' 0"
		cset "name='I2SOUT4_CH1 PCM_1_CAP_CH1' 0"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Speaker"
		PlaybackVolume "Speaker Volume"
	}
}

# Analog headset over USB-C (ASW5480 audio mode not done on mainline yet, no
# jack detection: priority below the Earpiece). Downlink like the earpiece,
# into the headphone DACs.
SectionDevice."Headphones" {
	Comment "Headphones (USB-C analog)"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='Headset Volume' 0,0"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 1"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 1"
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
		cset "name='Headphones Switch' on"
	]

	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 0"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 0"
	]

	Value {
		PlaybackPriority 40
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headset"
		PlaybackVolume "Headset Volume"
	}
}

# Main microphone (AIN0, left ADC -> modem CH1) and second microphone (AIN2,
# right ADC -> modem CH2, the modem's noise reference). PGA +12 dB as in the
# verified call.
SectionDevice."Mic" {
	Comment "Internal Microphones"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='PGA1 Volume' 2"
		cset "name='PGA2 Volume' 2"
		cset "name='PGA_L_Mux' 'AIN0'"
		cset "name='PGA_R_Mux' 'AIN2'"
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='ADC_R_Mux' 'Right Preamplifier'"
		cset "name='Main Mic Switch' on"
		cset "name='Second Mic Switch' on"
	]

	DisableSequence [
		cset "name='Second Mic Switch' off"
		cset "name='Main Mic Switch' off"
		cset "name='ADC_L_Mux' 'Idle'"
		cset "name='ADC_R_Mux' 'Idle'"
		cset "name='PGA_L_Mux' 'None'"
		cset "name='PGA_R_Mux' 'None'"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA1"
		CaptureVolume "PGA1 Volume"
	}
}

# Headset microphone (AIN1, left ADC), mono: the codec's second channel is
# switched to the left ADC too (MISO1_MUX), so the modem gets the headset mic
# on both CH1 and CH2 (factory single-mic path.
SectionDevice."Headset" {
	Comment "Headset Microphone (USB-C analog)"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='PGA1 Volume' 2"
		cset "name='PGA_L_Mux' 'AIN1'"
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='MISO1_MUX' 'UL1_CH1'"
		cset "name='Headset Mic Switch' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='MISO1_MUX' 'UL1_CH2'"
		cset "name='ADC_L_Mux' 'Idle'"
		cset "name='PGA_L_Mux' 'None'"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA1"
		CaptureVolume "PGA1 Volume"
	}
}
