#T2_MODEM_ROOT=/var/lib/titan2-modem   NVRAM sandbox (ro/: copy of the partitions, rw/: the modem's changes)
#T2_MODEM_USER=t2fsd                    user t2-ccci-fsd runs as
#T2_MODEM_IMAGE=/dev/disk/by-partlabel/modem_a   modem image (DRDI), opened read-only
#T2_MODEM_WAIT=60                       seconds to wait for READY
#T2_MODEM_LOG=/var/log/t2-modem
#T2_FSD_ARGS="-v"                       e.g. "-v -p": X:/Y: (protect) read-only
#T2_RPCD_ARGS="-v"
#T2_MODEM_RADIO=3                       after READY: AT+EFUN=<SIM mask> (1, 2, 3 = both); empty: radio off
#                                       (leave it empty when ModemManager owns the modem)
#T2_MODEM_AT=/dev/wwan0at0
