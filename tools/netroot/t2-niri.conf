#T2_NIRI_USER=user            who runs niri (groups video, input, seat, audio); default "user"
#T2_NIRI_LOG=/var/log/t2-niri.log
#T2_NIRI_SESSION=1           1: dbus-run-session + PipeWire/WirePlumber (t2-niri-session); 0: bare niri
#T2_GSK_RENDERER=auto        GTK 4 renderer (GSK_RENDERER for the whole session). Default: auto = GTK decides, which
#                            is panvk while PAN_I_WANT_A_BROKEN_VULKAN_DRIVER=1 is exported (Mali-G615 "v11": no CI
#                            board upstream, but on this phone with Mesa 26.3.0 it measured smoother than GLES).
#                            gl = panfrost GLES, the fallback when panvk misbehaves (GTK falls back to GL by itself
#                            only if the device fails to initialise, not on rendering faults). vulkan = force panvk.
#                            Takes effect on rc-service t2-niri restart.
