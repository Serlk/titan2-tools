#
# Titan 2 GPU DVFS. panthor's simple_ondemand jumps to
# the top OPP (1047 MHz) as soon as the GPU is busier than upthreshold % of a 50 ms period and
# stays there while it is busier than upthreshold - downdifferential; upstream 45/5 means any
# composited animation pins 1047 MHz. 70/10 settles where the GPU runs 60..70 % busy at a lower
# clock; 85/15 is the power-first variant (more jank in animations). 0/0 or no file = 45/5.
# Switch: edit, then reboot (panthor is a module loaded from the rootfs, so /etc/modprobe.d applies).
options panthor devfreq_upthreshold=70 devfreq_downdifferential=10
#options panthor devfreq_upthreshold=85 devfreq_downdifferential=15
