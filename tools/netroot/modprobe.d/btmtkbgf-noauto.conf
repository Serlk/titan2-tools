#
# Wi-Fi experiment: BT powers BGFSYS on/off during the Wi-Fi firmware start (shared A-die)
# and the first join after boot sometimes never authenticates. Load by hand: modprobe btmtkbgf
# (BT and Wi-Fi power-up race in conninfra). Drop once conninfra serialises BT and WF power-up.
blacklist btmtkbgf
