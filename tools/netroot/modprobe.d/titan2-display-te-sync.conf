#
# A61QWERTY46 command-mode panel: start frames and count vblank on real TE.
# Requires the cmd_te_sync parameter of the titan2 kernel branch (mediatek_drm).
options mediatek_drm cmd_te_sync=1
# DRIVER_SYNCOBJ on the KMS device (the syncobj parameter of the titan2 kernel branch): Smithay/niri
# then passes IN_FENCE_FD on every plane instead of waiting for the GPU in its main thread before
# each commit. Measured on the phone (GTK4 frame probe, GPU floor 664 MHz): long frames per minute
# 17 -> 3, presentation jumps 21 -> 5, no DRM warnings.
options mediatek_drm syncobj=1
