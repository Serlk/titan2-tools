#
# Titan 2: a panic reboots after 10 s (pstore/ramoops keeps the console), not after Alpine's
# 120 s (/usr/lib/sysctl.d/00-alpine.conf): an unattended phone should be back quickly.
# The kernel default is the same (CONFIG_PANIC_TIMEOUT=10), Alpine's sysctl overrides it at boot.
kernel.panic = 10
