#
# Titan 2. With CONFIG_UCLAMP_TASK a runnable RT task no
# longer pins its CPU at the top frequency (kernel/sched/fair.c effective_cpu_util); instead
# its CPU gets at least this utilization floor, 0..1024 (1024 = the old "always max").
# PipeWire's data loops and the camera softISP run SCHED_FIFO at 30..60 wake-ups per second.
# Without CONFIG_UCLAMP_TASK the key does not exist and sysctl only logs an error.
kernel.sched_util_clamp_min_rt_default = 128
