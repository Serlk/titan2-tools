#
# Titan 2: core dumps of crashed services go to /var/crash (created by install.d/titan2-misc.sh,
# pruned to the newest few at boot by local.d/t2-crash-prune.start). A service writes a core only
# with rc_ulimit="-c unlimited" in its init script or /etc/conf.d/<service> (t2-powerd, t2-speechd,
# t2-modemd, modemmanager). Read with: gdb /usr/sbin/ModemManager /var/crash/core.ModemManager.<pid>.<time>
# (apk add gdb; the plugin's symbols: build-aarch64/src/plugins/libmm-plugin-mtk-ccci.so).
kernel.core_pattern = /var/crash/core.%e.%p.%t
kernel.core_uses_pid = 1
