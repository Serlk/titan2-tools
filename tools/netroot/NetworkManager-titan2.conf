#
# Titan 2: NetworkManager manages Wi-Fi (and the modem); the USB link to the PC
# (SSH, netroot) is set up by the initramfs and t2-usbnet/t2-defroute and must not be touched.
[main]
dhcp=internal
plugins=keyfile

[keyfile]
unmanaged-devices=interface-name:usb*;interface-name:rndis*;interface-name:ncm*

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no
